<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GMX Mods | Premium Minecraft Marketplace</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- OVERLAYS & ALERTS CONTAINER -->
    <div id="alert-container"></div>

    <!-- AUTHENTICATION OVERLAY (Login / Register) -->
    <div id="auth-overlay" class="auth-overlay">
        <div class="auth-box gmx-card">
            <div class="auth-header">
                <h2>GMX <span class="highlight">SYSTEM ACCESS</span></h2>
                <p>Enter the elite Minecraft mod ecosystem</p>
            </div>
            
            <div class="auth-tabs">
                <button class="auth-tab active" onclick="switchAuthTab('login')">Login</button>
                <button class="auth-tab" onclick="switchAuthTab('register')">Register</button>
            </div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="login-username" required placeholder="Enter username...">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <div class="remember-row">
                    <label><input type="checkbox" id="remember-me"> Remember Me</label>
                </div>
                <button type="submit" class="gmx-btn primary glow-red">Initialize Login</button>
            </form>

            <!-- Register Form -->
            <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
                <div class="input-group">
                    <label>New Username</label>
                    <input type="text" id="reg-username" required placeholder="Choose unique username...">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" required placeholder="Create secure password...">
                </div>
                <button type="submit" class="gmx-btn primary glow-gold">Create GMX Profile</button>
            </form>
        </div>
    </div>

    <!-- GIFT OPENING MODAL -->
    <div id="gift-modal" class="modal-overlay hidden">
        <div class="modal-box gmx-card">
            <h2>🎁 <span class="highlight">INCOMING GIFT!</span></h2>
            <p id="gift-sender-text" class="gift-sender-label"></p>
            <div class="gift-box-container" id="interactive-gift-box" onclick="openActiveGift()">
                <div class="mystery-box glow-gold-pulse">📦</div>
                <span class="click-to-open">Click to Unwrap!</span>
            </div>
            <div id="gift-content-reveal" class="hidden">
                <blockquote id="gift-letter-display" class="gift-letter"></blockquote>
                <div id="gift-item-display" class="gift-item-card"></div>
                <button class="gmx-btn primary glow-red" onclick="claimGiftContent()">Claim to Library</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div id="app-wrapper" class="app-wrapper">
        
        <!-- TOP NAVIGATION BAR -->
        <header class="gmx-navbar">
            <div class="nav-brand" onclick="navigate('home')">
                <span class="brand-logo">⚡</span>
                <span class="brand-title">GMX <span class="highlight">MODS</span></span>
            </div>
            
            <nav class="nav-links">
                <button class="nav-link active" onclick="navigate('home')">Home</button>
                <button class="nav-link" onclick="navigate('store')">Store</button>
                <button class="nav-link" onclick="navigate('daily')">Daily Reward</button>
                <button class="nav-link" onclick="navigate('wheel')">Spin Wheel</button>
                <button class="nav-link" onclick="navigate('gifts')">Gift Center</button>
                <button class="nav-link" onclick="navigate('blog')">Updates Blog</button>
                <button class="nav-link" onclick="navigate('about')">About</button>
            </nav>

            <div class="nav-right">
                <div class="coin-display glow-gold" onclick="navigate('daily')">
                    <span class="coin-icon">🪙</span>
                    <span id="nav-coin-balance">5,000</span> <span class="coin-label">GMX</span>
                </div>
                <div class="user-profile-badge" onclick="navigate('profile')">
                    <span id="nav-username">Agent</span>
                    <div class="avatar-mini">⚡</div>
                </div>
                <button class="logout-btn" onclick="logoutUser()" title="Logout">⏻</button>
            </div>
        </header>

        <!-- DYNAMIC PAGE CONTENT CONTAINER -->
        <main id="main-content">
            <!-- Rendered dynamically via JavaScript router -->
        </main>

        <!-- FOOTER -->
        <footer class="gmx-footer">
            <p>&copy; 2026 GMX Ecosystem. Engineered for Elite Minecraft Competition.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
